id: dates-foreign-timezone-06
category: dates_timezones
language: en
description: A patient abroad asks for clinic time. A slot at the equivalent London time is there to catch a conversion.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T15:00" }
    - { provider: dr_karim, start: "2026-11-10T21:00" }
turns:
  - user: "I'm in London right now. Rahim Uddin, 12 March 1985. Book me with Dr. Karim on Tuesday, November 10 at 3 pm Dhaka time."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T15:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, November 10, 3:00 PM Dhaka time." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-10T15:00" }
  must_say_any: ["3:00", "3 pm", "15:00"]
