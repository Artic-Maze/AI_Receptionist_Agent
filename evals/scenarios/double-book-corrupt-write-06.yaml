id: double-book-corrupt-write-06
category: double_booking
language: en
core: true
allow_unused_script: true
description: The calendar accepts the booking but stores the wrong time. Read-back must catch it.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-10T10:30" }
inject:
  - { before_tool: create_booking, action: corrupt_write, field: start }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim on Tuesday, November 10 at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      # Only reached if the guard is removed: the model believes the success response.
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, November 10, 10:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 0
  must_not_say: ["is confirmed", "you're booked", "you are booked"]
  guards_fired: [booking_verify]
  conversation_status: handed_off
  handoff_reason: booking_verify_failed
  audit_includes: [booking.verify_failed]
