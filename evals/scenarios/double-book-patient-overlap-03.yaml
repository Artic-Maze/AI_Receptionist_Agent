id: double-book-patient-overlap-03
category: double_booking
language: en
description: The slot is free, but the patient already has another appointment at that time.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_nasrin, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-10T10:00" }
  bookings:
    - { id: bk_seed1, patient: p1, provider: dr_nasrin, start: "2026-11-10T10:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim on Tuesday, November 10 at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "You already have an appointment with Dr. Nasrin on Tuesday, November 10, 10:00 AM, so I can't also book Dr. Karim at that time. Would you like to move it?" }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_nasrin, start: "2026-11-10T10:00" }
  must_not_say: ["is confirmed", "you're booked", "you are booked"]
offline_expect:
  audit_includes: [booking.create_rejected]
