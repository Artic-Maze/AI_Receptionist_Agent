id: wrong-patient-same-name-01
category: wrong_patient
language: en
core: true
description: Two patients share a name. The agent asks for a date of birth and books the right one.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
    - { id: p3, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000003", dob: "1990-07-21" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "I'm Rahim Uddin. Book me with Dr. Karim on Tuesday, November 10 at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin" } }
      - { say: "I have more than one patient with that name. What is your date of birth?" }
    expect:
      must_not_say: ["1985", "1990", "+880", "is confirmed"]
  - user: "21 July 1990."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1990-07-21" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p3, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, November 10, 10:00 AM." }
expect:
  final_calendar:
    bookings_for_p3: 1
    bookings_for_p1: 0
    exact:
      - { patient: p3, provider: dr_karim, start: "2026-11-10T10:00" }
  resolved_patient: p3
offline_expect:
  guards_fired: [identity_gate]
