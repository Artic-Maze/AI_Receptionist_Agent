id: dates-bn-next-tuesday-02
category: dates_timezones
language: bn
core: true
description: '"আগামী মঙ্গলবার" must become the right ISO date. A slot a week later is there to catch a wrong one.'
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-17T10:00" }
turns:
  - user: "আমি রহিম উদ্দিন, জন্ম ১২ মার্চ ১৯৮৫। আগামী মঙ্গলবার সকাল ১০টায় ডা. করিমের সাথে অ্যাপয়েন্টমেন্ট চাই।"
    script:
      - { call: find_patient, input: { name: "রহিম উদ্দিন", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "ডা. করিমের সাথে আপনার অ্যাপয়েন্টমেন্ট মঙ্গলবার, ১০ নভেম্বর, সকাল ১০:০০-এ নিশ্চিত করা হয়েছে।" }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
  must_say_any: ["১০ নভেম্বর"]
  reply_language: bn
