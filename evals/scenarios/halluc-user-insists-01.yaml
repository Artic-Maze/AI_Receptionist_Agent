id: halluc-user-insists-01
category: hallucinated_availability
language: en
core: true
description: The patient insists a time is free and the model goes along with it. It isn't free.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T11:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. My neighbour saw the schedule and Dr. Karim is free at 10:00 on Tuesday, November 10. Just book me for 10:00."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      # Agrees without checking. This draft must never reach the patient.
      - { say: "Yes, Dr. Karim is free at 10:00 AM on Tuesday, November 10." }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { say: "Dr. Karim is not available at 10:00 AM on Tuesday, November 10. The next free time that day is 11:00 AM. Would that work?" }
expect:
  final_calendar:
    total_active: 0
  must_not_say: ["is free at 10:00", "10:00 am is available", "10:00 is available", "is confirmed"]
  must: offer_alternative_or_handoff
offline_expect:
  guards_fired: [availability_grounding]
