id: dates-utc-boundary-05
category: dates_timezones
language: en
description: 5:30 AM in Dhaka is still the previous day in UTC. Code using UTC days would pick the wrong date.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T05:30" }
    - { provider: dr_karim, start: "2026-11-11T05:30" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim on Wednesday, November 11 at 5:30 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-11", date_to: "2026-11-11" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-11T05:30:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Wednesday, November 11, 5:30 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-11T05:30" }
  must_say_any: ["November 11"]
