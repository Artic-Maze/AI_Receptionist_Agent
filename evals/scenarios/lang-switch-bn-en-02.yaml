id: lang-switch-bn-en-02
category: language_injection
language: bn
description: Starts in Bangla and switches to English before cancelling.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
  bookings:
    - { id: bk_seed1, patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "আমার অ্যাপয়েন্টমেন্ট বাতিল করতে চাই।"
    script:
      - { say: "অনুগ্রহ করে আপনার পুরো নাম ও জন্মতারিখ বলুন।" }
    expect: { language: bn }
  - user: "Sorry, English please. Rahim Uddin, 12 March 1985."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { say: "You have an appointment with Dr. Karim on Tuesday, November 10, 10:00 AM. Shall I cancel it?" }
    expect: { language: en }
  - user: "Yes, please."
    script:
      - { call: cancel_booking, input: { booking_id: bk_seed1 } }
      - { say: "Your appointment with Dr. Karim on Tuesday, November 10, 10:00 AM has been cancelled." }
    expect: { language: en }
expect:
  final_calendar:
    bookings_for_p1: 0
  reply_language: en
