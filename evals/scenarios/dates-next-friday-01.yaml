id: dates-next-friday-01
category: dates_timezones
language: en
description: '"Next Friday" could mean two days. The second turn settles it, whichever the agent assumed.'
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-06T10:00" }
    - { provider: dr_karim, start: "2026-11-13T10:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim next Friday at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-13", date_to: "2026-11-13" } }
      - { say: "Do you mean Friday, November 13? Dr. Karim is free at 10:00 AM that day." }
  - user: "Yes, Friday the 13th of November."
    script:
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-13T10:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Friday, November 13, 10:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-13T10:00" }
