id: double-book-race-01
category: double_booking
language: en
core: true
description: Someone else takes the slot between the availability check and the booking.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-10T10:30" }
inject:
  - { after_tool: check_availability, action: take_slot, slot: { provider: dr_karim, start: "2026-11-10T10:00" } }
turns:
  - user: "Rahim Uddin, born 12 March 1985. Book me with Dr. Karim on Tuesday, November 10 at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { say: "Sorry, that time was just taken by someone else. Dr. Karim is still free on Tuesday, November 10, at 10:30 AM. Would that work?" }
expect:
  final_calendar:
    bookings_for_p1: 0
    total_active: 1
  tool_sequence_includes: [check_availability, create_booking]
  must_not_say: ["is confirmed", "you're booked", "you are booked", "you're all set"]
  must: offer_alternative_or_handoff
  audit_includes: [booking.create_rejected]
offline_expect:
  guards_not_fired: [availability_grounding, confirmation_check]
