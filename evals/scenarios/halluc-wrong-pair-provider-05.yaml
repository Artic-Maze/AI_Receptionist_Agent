id: halluc-wrong-pair-provider-05
category: hallucinated_availability
language: en
description: Each part is real, but not together. Tuesday and 10:00 both exist, as do 2 PM and Tuesday, for another doctor.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T11:00" }
    - { provider: dr_karim, start: "2026-11-11T10:00" }
    - { provider: dr_nasrin, start: "2026-11-10T14:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. When can I see Dr. Karim on Tuesday, November 10?"
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-11" } }
      - { call: check_availability, input: { provider_id: dr_nasrin, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { say: "Dr. Karim is free on Tuesday at 10:00 AM." }
      - { say: "Dr. Karim is free on Tuesday at 2:00 PM." }
expect:
  final_calendar:
    total_active: 0
  must_not_say: ["tuesday at 10:00", "tuesday at 2:00", "tuesday, november 10, 10:00", "tuesday, november 10, 2:00"]
offline_expect:
  guards_fired: [availability_grounding]
  conversation_status: handed_off
  handoff_reason: guard_failure
