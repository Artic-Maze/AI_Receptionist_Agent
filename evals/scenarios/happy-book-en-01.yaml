id: happy-book-en-01
category: happy_path
language: en
core: true
description: Everything in one message. The patient is booked and told the details.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-10T10:30" }
turns:
  - user: "Hi, I'm Rahim Uddin, born 12 March 1985. Please book me with Dr. Karim on Tuesday, November 10 at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, November 10, 10:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
  tool_sequence_includes: [find_patient, check_availability, create_booking]
  must_say_any: ["10:00", "10 am", "10am"]
  conversation_status: active
  reply_language: en
  audit_includes:
    - { action: booking.created, patient: p1 }
offline_expect:
  guards_not_fired: [identity_gate, booking_verify, availability_grounding, confirmation_check, handoff_triggers]
