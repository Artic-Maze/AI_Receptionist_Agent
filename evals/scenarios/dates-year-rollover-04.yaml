id: dates-year-rollover-04
category: dates_timezones
language: en
now: "2026-12-30T11:00"
description: '"Next Monday" at the end of December lands in the following year.'
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2027-01-04T09:00" }
    - { provider: dr_karim, start: "2027-01-04T09:30" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim next Monday, January 4, at 9 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2027-01-04", date_to: "2027-01-04" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2027-01-04T09:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Monday, January 4, 9:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2027-01-04T09:00" }
