id: double-book-two-patients-02
category: double_booking
language: en
core: true
description: Two patients in separate conversations ask for the same slot. Only the first gets it.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
    - { id: p2, name: "Fatema Begum", nameBn: "ফাতেমা বেগম", phone: "+8801811000002", dob: "1978-11-02" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-10T10:30" }
turns:
  - conversation: first
    user: "Rahim Uddin, 12 March 1985. Dr. Karim on Tuesday, November 10 at 10 am please."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, November 10, 10:00 AM." }
  - conversation: second
    user: "Fatema Begum, 2 November 1978. Dr. Karim on Tuesday, November 10 at 10 am please."
    script:
      - { call: find_patient, input: { name: "Fatema Begum", dob: "1978-11-02" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      # The model tries anyway. The calendar has to say no.
      - { call: create_booking, input: { patient_id: p2, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "Sorry, 10:00 AM on Tuesday is already taken. Dr. Karim is free on Tuesday, November 10, at 10:30 AM. Would that work?" }
    expect:
      must_not_say: ["is confirmed", "you're booked", "you are booked"]
expect:
  final_calendar:
    bookings_for_p1: 1
    bookings_for_p2: 0
    total_active: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
  must: offer_alternative_or_handoff
