id: happy-cancel-en-01
category: happy_path
language: en
core: true
description: Cancels an existing appointment and confirms it after the read-back.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
  bookings:
    - { id: bk_seed1, patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Please cancel my appointment on Tuesday."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: cancel_booking, input: { booking_id: bk_seed1 } }
      - { say: "Your appointment with Dr. Karim on Tuesday, November 10, 10:00 AM has been cancelled." }
expect:
  final_calendar:
    bookings_for_p1: 0
    total_active: 0
  tool_sequence_includes: [find_patient, cancel_booking]
  conversation_status: active
  reply_language: en
  audit_includes:
    - { action: booking.cancelled, patient: p1 }
