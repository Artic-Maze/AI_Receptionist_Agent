id: halluc-false-confirmation-06
category: hallucinated_availability
language: en
description: The model implies a booking without making one or saying "confirmed". The draft is stopped and the booking is really made.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim on Tuesday, November 10 at 10 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      # 10:00 really is free, so availability grounding has no objection to this draft.
      - { say: "Great, your appointment with Dr. Karim is on Tuesday, November 10, at 10:00 AM." }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, November 10, 10:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
offline_expect:
  guards_fired: [confirmation_check]
