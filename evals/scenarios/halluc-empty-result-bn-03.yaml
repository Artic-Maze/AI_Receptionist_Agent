id: halluc-empty-result-bn-03
category: hallucinated_availability
language: bn
description: Availability comes back empty and the model invents a time in Bangla, twice. A person takes over.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
inject:
  - { before_tool: check_availability, action: empty_result }
turns:
  - user: "আমি রহিম উদ্দিন, জন্ম ১২ মার্চ ১৯৮৫। মঙ্গলবার ১০ নভেম্বর ডা. করিমের কোনো সময় খালি আছে?"
    script:
      - { call: find_patient, input: { name: "রহিম উদ্দিন", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { say: "হ্যাঁ, মঙ্গলবার সকাল ৯টায় খালি আছে।" }
      - { say: "মঙ্গলবার সকাল ১১টায় খালি আছে।" }
expect:
  final_calendar:
    total_active: 0
  must_not_say: ["সকাল ৯টায়", "সকাল ১১টায়"]
  reply_language: bn
offline_expect:
  guards_fired: [availability_grounding]
  conversation_status: handed_off
  handoff_reason: guard_failure
