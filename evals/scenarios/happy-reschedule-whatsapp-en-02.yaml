id: happy-reschedule-whatsapp-en-02
category: happy_path
language: en
channel: whatsapp
caller_phone: "+8801711000001"
description: A reschedule on WhatsApp over three turns, identified by sender number and name.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801711000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-12T09:00" }
    - { provider: dr_karim, start: "2026-11-12T09:30" }
  bookings:
    - { id: bk_seed1, patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "Hi, it's Rahim Uddin. I need to change my appointment."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin" } }
      - { say: "You have an appointment with Dr. Karim on Tuesday, November 10, 10:00 AM. What day would suit you better?" }
  - user: "Thursday, November 12, in the morning please."
    script:
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-12", date_to: "2026-11-12" } }
      - { say: "Dr. Karim is free on Thursday, November 12, at 9:00 AM or 9:30 AM. Which would you like?" }
  - user: "9:30"
    script:
      - { call: reschedule_booking, input: { booking_id: bk_seed1, new_start: "2026-11-12T09:30:00+06:00" } }
      - { say: "Your appointment with Dr. Karim has been moved to Thursday, November 12, 9:30 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-12T09:30" }
  must_say_any: ["9:30"]
  conversation_status: active
  reply_language: en
