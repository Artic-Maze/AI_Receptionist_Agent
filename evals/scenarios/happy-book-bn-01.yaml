  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-10T10:30" }
turns:
  - user: "আমি ফাতেমা বেগম, জন্মতারিখ ২ নভেম্বর ১৯৭৮। মঙ্গলবার ১০ নভেম্বর সকাল ১০টায় ডা. করিমের সাথে অ্যাপয়েন্টমেন্ট চাই।"
