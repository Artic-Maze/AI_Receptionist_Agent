id: lang-switch-en-bn-01
category: language_injection
language: en
description: Starts in English and switches to Bangla mid-booking. Replies follow.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "Hi, I need an appointment."
    script:
      - { say: "Of course. Could I have your full name and date of birth?" }
    expect: { language: en }
  - user: "আমি রহিম উদ্দিন, জন্ম ১২ মার্চ ১৯৮৫।"
    script:
      - { call: find_patient, input: { name: "রহিম উদ্দিন", dob: "1985-03-12" } }
      - { say: "ধন্যবাদ। কোন ডাক্তারের সাথে এবং কবে দেখা করতে চান?" }
    expect: { language: bn }
  - user: "ডা. করিম, মঙ্গলবার ১০ নভেম্বর সকাল ১০টায়।"
    script:
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-10", date_to: "2026-11-10" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-11-10T10:00:00+06:00" } }
      - { say: "ডা. করিমের সাথে আপনার অ্যাপয়েন্টমেন্ট মঙ্গলবার, ১০ নভেম্বর, সকাল ১০:০০-এ নিশ্চিত করা হয়েছে।" }
    expect: { language: bn }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
  reply_language: bn
