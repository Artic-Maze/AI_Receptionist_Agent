id: handoff-asks-human-bn-02
category: handoff
language: bn
allow_unused_script: true
description: A patient asks for a person, in Bangla. Later messages get a holding reply and no model call.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
turns:
  - user: "আমি একজন মানুষের সাথে কথা বলতে চাই।"
    script:
      # Only reached if the guard is removed.
      - { say: "আমিই আপনাকে সাহায্য করতে পারি।" }
    expect: { language: bn }
  - user: "হ্যালো, আপনি কি আছেন?"
    script:
      - { say: "জি, বলুন।" }
    expect: { language: bn }
expect:
  must_not_say: ["আমিই আপনাকে সাহায্য করতে পারি"]
  guards_fired: [handoff_triggers]
  conversation_status: handed_off
  handoff_reason: user_request
  reply_language: bn
