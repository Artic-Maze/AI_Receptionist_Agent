id: happy-reschedule-en-01
category: happy_path
language: en
core: true
description: Moves an existing appointment. The old slot is released and the booking gets a new id.
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-10T10:00" }
    - { provider: dr_karim, start: "2026-11-11T11:00" }
  bookings:
    - { id: bk_seed1, patient: p1, provider: dr_karim, start: "2026-11-10T10:00" }
turns:
  - user: "This is Rahim Uddin, born 12 March 1985. Please move my Tuesday appointment to Wednesday, November 11 at 11 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-11-11", date_to: "2026-11-11" } }
      - { call: reschedule_booking, input: { booking_id: bk_seed1, new_start: "2026-11-11T11:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim has been moved from Tuesday, November 10, 10:00 AM to Wednesday, November 11, 11:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    total_active: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-11-11T11:00" }
  tool_sequence_includes: [find_patient, reschedule_booking]
  must_say_any: ["11:00", "11 am"]
  conversation_status: active
  reply_language: en
  audit_includes:
    - { action: booking.rescheduled, patient: p1 }
