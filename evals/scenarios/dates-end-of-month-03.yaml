id: dates-end-of-month-03
category: dates_timezones
language: en
now: "2026-11-30T16:00"
description: '"Tomorrow" on the last day of November is December 1.'
seed:
  patients:
    - { id: p1, name: "Rahim Uddin", nameBn: "রহিম উদ্দিন", phone: "+8801000000001", dob: "1985-03-12" }
  slots:
    - { provider: dr_karim, start: "2026-11-30T17:00" }
    - { provider: dr_karim, start: "2026-12-01T09:00" }
turns:
  - user: "Rahim Uddin, 12 March 1985. Book me with Dr. Karim tomorrow at 9 am."
    script:
      - { call: find_patient, input: { name: "Rahim Uddin", dob: "1985-03-12" } }
      - { call: check_availability, input: { provider_id: dr_karim, date_from: "2026-12-01", date_to: "2026-12-01" } }
      - { call: create_booking, input: { patient_id: p1, provider_id: dr_karim, start: "2026-12-01T09:00:00+06:00" } }
      - { say: "Your appointment with Dr. Karim is confirmed for Tuesday, December 1, 9:00 AM." }
expect:
  final_calendar:
    bookings_for_p1: 1
    exact:
      - { patient: p1, provider: dr_karim, start: "2026-12-01T09:00" }
  must_say_any: ["December 1"]
