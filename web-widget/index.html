<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Receptionist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #f3f2ee;
    --surface: #fcfcfb;
    --ink: #1c1c1a;
    --ink-soft: #5c5b56;
    --line: #e1e0d9;
    --agent: #f0efe9;
    --accent: #0f5f58;
    --accent-ink: #ffffff;
    --accent-soft: #dcecea;
    --notice: #fdf1dc;
    --notice-ink: #6b4a06;
    --error: #a12b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #121211;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-soft: #b5b4aa;
      --line: #32322f;
      --agent: #272725;
      --accent: #3fb3a6;
      --accent-ink: #06211e;
      --accent-soft: #15332f;
      --notice: #3a2d10;
      --notice-ink: #f5d48a;
      --error: #f08b8b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(360px, 460px);
    gap: 24px;
    max-width: 1200px;
    height: 100%;
    margin: 0 auto;
    padding: 24px;
  }

  /* ---- Directory: doctors, schedule, demo patients ---- */
  .directory {
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
    padding: 4px 4px 24px;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .intro h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 600; line-height: 1.25; }
  .intro p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
  h2 { margin: 0 0 12px; font-size: 1.0625rem; font-weight: 600; }
  .hint { margin: -6px 0 12px; font-size: .875rem; color: var(--ink-soft); }
  .days {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 14px;
  }
  .days button {
    flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: .875rem;
    min-height: 40px;
    padding: 4px 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .doctors { display: grid; gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .doctor h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .specialty { margin: 0; font-size: .875rem; color: var(--ink-soft); }
  .hours { margin: 8px 0 0; font-size: .875rem; }
  .hours div + div { margin-top: 2px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .slot {
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: .875rem;
    font-variant-numeric: tabular-nums;
    min-height: 36px;
    padding: 2px 10px;
    border-radius: 8px;
    white-space: nowrap;
    cursor: pointer;
  }
  .slot:hover { background: var(--accent-soft); }
  .none { margin: 12px 0 0; font-size: .875rem; color: var(--ink-soft); }
  .patients {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .patient {
    width: 100%;
    height: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .patient:hover { border-color: var(--accent); }
  .patient-name { font-weight: 600; }
  .meta { font-size: .875rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag {
    font-size: .75rem;
    background: var(--notice);
    color: var(--notice-ink);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .new-patient {
    margin-top: 10px;
    border: 1px dashed var(--accent);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 12px;
    cursor: pointer;
  }
  .new-patient:hover { background: var(--accent-soft); }
  .status { margin: 0; color: var(--ink-soft); font-size: .875rem; }

  /* ---- Chat ---- */
  .chat {
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .title { flex: 1; min-width: 0; }
  .chat h2 { margin: 0; font-size: 1rem; font-weight: 600; }
  .subtitle { margin: 0; font-size: .8125rem; color: var(--ink-soft); }
  .toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
    flex-shrink: 0;
  }
  .toggle button {
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: .8125rem;
    min-height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: .875rem;
    min-height: 40px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .starters button:hover { background: var(--accent-soft); }
  .progress { align-self: flex-start; font-size: .875rem; color: var(--ink-soft); padding: 2px 4px; }
  .notice {
    background: var(--notice);
    color: var(--notice-ink);
    font-size: .875rem;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
  }
  .error { align-self: center; font-size: .875rem; color: var(--error); text-align: center; }
  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    background: transparent;
  }
  .send {
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 12px;
    cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .call {
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .call:hover { background: var(--accent-soft); }
  .call[aria-pressed="true"] { background: var(--error); border-color: var(--error); color: var(--surface); }
  .call:disabled { opacity: .5; cursor: default; }
  .call-status { flex: 1; align-self: center; margin: 0; font-size: .875rem; color: var(--ink-soft); }
  .restart {
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: .8125rem;
    min-height: 32px;
    padding: 0 4px;
    text-decoration: underline;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); height: auto; padding: 16px; }
    .directory { overflow: visible; padding: 0; }
    .chat { height: min(720px, 85dvh); }
  }
  @media (max-width: 600px) {
    .layout { padding: 16px 0 0; gap: 16px; }
    .directory { padding: 0 16px; }
    .chat { height: 100dvh; border-radius: 0; border-left: 0; border-right: 0; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="directory" aria-labelledby="clinic-name">
    <header class="intro">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="clinic-name"></h1>
      <p id="intro"></p>
    </header>
    <section aria-labelledby="doctors-title">
      <h2 id="doctors-title"></h2>
      <p class="hint" id="doctors-hint"></p>
      <div class="days" id="days" role="group"></div>
      <div class="doctors" id="doctors"></div>
    </section>
    <section aria-labelledby="patients-title">
      <h2 id="patients-title"></h2>
      <p class="hint" id="patients-hint"></p>
      <ul class="patients" id="patients"></ul>
      <button type="button" class="new-patient" id="new-patient"></button>
    </section>
    <p class="status" id="directory-status" hidden></p>
  </aside>

  <main class="chat" id="chat">
    <header>
      <div class="title">
        <h2 id="title"></h2>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <button type="button" class="restart" id="restart"></button>
      <div class="toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" lang="es" aria-pressed="false">Español</button>
      </div>
    </header>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="notice" id="notice" hidden></div>
    <form id="form">
      <button class="call" id="call" type="button" aria-pressed="false" hidden></button>
      <p class="call-status" id="call-status" role="status" hidden></p>
      <textarea id="input" rows="1" maxlength="2000" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit"></button>
    </form>
  </main>
</div>
<script>
  const TEXT = {
    en: {
      title: 'Clinic Receptionist',
      subtitle: 'AI assistant for appointments. For an emergency, call 999.',
      greeting: 'Hello! I can book, change or cancel an appointment, or register you as a new patient. How can I help?',
      placeholder: 'Type your message',
      send: 'Send',
      restart: 'New chat',
      handedOff: 'A member of our staff has this conversation and will reply here.',
      unreachable: 'I couldn’t reach the clinic. Please try again.',
      tooMany: 'That’s a lot of messages. Please wait a minute and try again.',
      failed: 'Something went wrong on our side. Please try again, or call the clinic.',
      starters: ['Book an appointment', 'Change my appointment', 'Cancel my appointment', 'I’m a new patient'],
      tools: {
        find_patient: 'Checking your details…',
        register_patient: 'Registering you…',
        check_availability: 'Checking availability…',
        create_booking: 'Booking your appointment…',
        reschedule_booking: 'Moving your appointment…',
        cancel_booking: 'Cancelling your appointment…',
        get_booking: 'Checking your booking…',
        handoff_to_human: 'Connecting you with our staff…',
        default: 'One moment…',
      },
      eyebrow: 'Demo clinic',
      intro: 'The doctors, schedule and patients here are fictional. Try the receptionist as one of the patients below, or register as a new patient in the chat.',
      doctorsTitle: 'Doctors and free times',
      doctorsHint: 'Pick a day, then tap a time to ask for it in the chat.',
      today: 'Today',
      noSlots: 'No free times on this day.',
      patientsTitle: 'Demo patients',
      patientsHint: 'Tap a patient to introduce yourself as them in the chat.',
      born: 'Born',
      sharedPhone: 'Shares a phone with family',
      sameName: 'Same name as another patient',
      newPatient: 'Register as a new patient',
      loading: 'Loading the schedule…',
      loadFailed: 'Couldn’t load the schedule. Try reloading the page.',
      empty: 'No doctors are set up yet.',
      weekdays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      specialties: {},
      askSlot: (doctor, day, time) => `I’d like to book with ${doctor} on ${day} at ${time}.`,
      introduce: (name, dob) => `Hi, I’m ${name}, born ${dob}.`,
      register: 'Hi, I’m a new patient and I’d like to register.',
      formatDob: (d, month, y) => `${d} ${month} ${y}`,
      call: 'Call',
      endCall: 'End call',
      connecting: 'Connecting…',
      allowMic: 'Allow the microphone when your browser asks.',
      onCall: 'On a call. Speak when you’re ready.',
      callEnded: 'Call ended.',
      callFailed: 'The call couldn’t start. Please try again.',
      micBlocked: 'The call needs your microphone. Allow it in your browser’s settings, then try again.',
    },
    es: {
      title: 'Recepción de la clínica',
      subtitle: 'Asistente de IA para citas. En caso de emergencia, llame al 999.',
      greeting: '¡Hola! Puedo reservar, cambiar o cancelar una cita, o registrarle como paciente. ¿En qué puedo ayudarle?',
      placeholder: 'Escriba su mensaje',
      send: 'Enviar',
      restart: 'Nuevo chat',
      handedOff: 'Un miembro de nuestro personal está atendiendo esta conversación y le responderá aquí.',
      unreachable: 'No he podido conectar con la clínica. Inténtelo de nuevo.',
      tooMany: 'Ha enviado muchos mensajes. Espere un minuto y vuelva a intentarlo.',
      failed: 'Algo ha fallado por nuestra parte. Inténtelo de nuevo o llame a la clínica.',
      starters: ['Reservar una cita', 'Cambiar mi cita', 'Cancelar mi cita', 'Registrarme como paciente'],
      tools: {
        find_patient: 'Comprobando sus datos…',
        register_patient: 'Registrándole…',
        check_availability: 'Consultando la disponibilidad…',
        create_booking: 'Reservando su cita…',
        reschedule_booking: 'Cambiando su cita…',
        cancel_booking: 'Cancelando su cita…',
        get_booking: 'Consultando su cita…',
        handoff_to_human: 'Poniéndole en contacto con nuestro personal…',
        default: 'Un momento…',
      },
      eyebrow: 'Clínica de demostración',
      intro: 'Los médicos, horarios y pacientes de esta página son ficticios. Pruebe la recepción como uno de los pacientes de abajo, o regístrese como paciente en el chat.',
      doctorsTitle: 'Médicos y horas libres',
      doctorsHint: 'Elija un día y toque una hora para pedirla en el chat.',
      today: 'Hoy',
      noSlots: 'No hay horas libres este día.',
      patientsTitle: 'Pacientes de demostración',
      patientsHint: 'Toque un paciente para presentarse como esa persona en el chat.',
      born: 'Nac.',
      sharedPhone: 'Comparte teléfono con su familia',
      sameName: 'Mismo nombre que otro paciente',
      newPatient: 'Registrarme como paciente',
      loading: 'Cargando el horario…',
      loadFailed: 'No se pudo cargar el horario. Recargue la página.',
      empty: 'Todavía no hay médicos configurados.',
      weekdays: ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'],
      months: ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'],
      // The clinic stores specialties in English.
      specialties: { 'General Medicine': 'Medicina general', Cardiology: 'Cardiología', Paediatrics: 'Pediatría' },
      // A list, not a sentence, so it needs no "el" or "la" before the doctor's title.
      // "a. m." already ends in a full stop.
      askSlot: (doctor, day, time) => `Quisiera reservar una cita: ${doctor}, ${day}, ${time}`.replace(/\.?$/, '.'),
      introduce: (name, dob) => `Hola, soy ${name}, nací el ${dob}.`,
      register: 'Hola, es mi primera vez en la clínica y quisiera registrarme.',
      formatDob: (d, month, y) => `${d} de ${month} de ${y}`,
      call: 'Llamar',
      endCall: 'Colgar',
      connecting: 'Conectando…',
      allowMic: 'Permita el micrófono cuando el navegador se lo pida.',
      onCall: 'En llamada. Hable cuando quiera.',
      callEnded: 'Llamada finalizada.',
      callFailed: 'No se pudo iniciar la llamada. Inténtelo de nuevo.',
      micBlocked: 'La llamada necesita su micrófono. Permítalo en la configuración del navegador y vuelva a intentarlo.',
    },
  };

  const $ = (id) => document.getElementById(id);
  const messages = $('messages');
  const input = $('input');
  const send = $('send');
  const notice = $('notice');
  const toggles = document.querySelectorAll('.toggle button');

  let language = 'en';
  let conversationId = null;
  let busy = false;
  let handedOff = false;
  let progress = null;

  // ---- Directory ------------------------------------------------------------

  let directory = null;
  let directoryState = 'loading';
  let selectedDay = null;

  function el(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  const weekdayOf = (date) => {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  };

  /** "Sun–Thu", or "Sun, Tue, Thu": runs of three or more days collapse into a range. */
  function dayList(days, t) {
    const parts = [];
    for (let i = 0; i < days.length; ) {
      let j = i;
      while (j + 1 < days.length && days[j + 1] === days[j] + 1) j += 1;
      if (j - i >= 2) parts.push(`${t.weekdays[days[i]]}–${t.weekdays[days[j]]}`);
      else for (let k = i; k <= j; k += 1) parts.push(t.weekdays[days[k]]);
      i = j + 1;
    }
    return parts.join(', ');
  }

  /** Weekdays that share the same hours, one line each: "Sun–Thu · 9:00 AM – 1:00 PM". */
  function hoursLines(hours, t) {
    const byDay = new Map();
    for (const block of hours) {
      const text = `${block[`start_${language}`]} – ${block[`end_${language}`]}`;
      byDay.set(block.weekday, [...(byDay.get(block.weekday) ?? []), text]);
    }
    const groups = new Map();
    for (let weekday = 0; weekday < 7; weekday += 1) {
      if (!byDay.has(weekday)) continue;
      const key = byDay.get(weekday).join(', ');
      groups.set(key, [...(groups.get(key) ?? []), weekday]);
    }
    return [...groups].map(([blocks, days]) => `${dayList(days, t)} · ${blocks}`);
  }

  function formatDob(dob, t) {
    const [y, m, d] = dob.split('-').map(Number);
    return t.formatDob(d, t.months[m - 1], y);
  }

  function prefill(text) {
    input.value = text;
    input.dispatchEvent(new Event('input'));
    const box = $('chat').getBoundingClientRect();
    if (box.top < 0 || box.bottom > window.innerHeight) $('chat').scrollIntoView({ behavior: 'smooth', block: 'start' });
    input.focus({ preventScroll: true });
  }

  function renderDays(t) {
    const row = $('days');
    row.replaceChildren();
    row.setAttribute('aria-label', t.doctorsTitle);
    directory.days.forEach((day, index) => {
      const button = el('button');
      button.type = 'button';
      const [, , d] = day.date.split('-');
      button.textContent = index === 0 ? t.today : `${t.weekdays[weekdayOf(day.date)]} ${Number(d)}`;
      button.title = day[`label_${language}`];
      button.setAttribute('aria-pressed', String(day.date === selectedDay));
      button.addEventListener('click', () => {
        selectedDay = day.date;
        renderDirectory();
      });
      row.append(button);
    });
  }

  function renderDoctors(t) {
    const list = $('doctors');
    list.replaceChildren();
    const day = directory.days.find((d) => d.date === selectedDay);
    for (const doctor of directory.providers) {
      const card = el('article', 'card doctor');
      card.append(el('h3', null, doctor.name));
      if (doctor.specialty) card.append(el('p', 'specialty', t.specialties[doctor.specialty] ?? doctor.specialty));
      if (doctor.hours?.length) {
        const hours = el('div', 'hours');
        for (const line of hoursLines(doctor.hours, t)) hours.append(el('div', null, line));
        card.append(hours);
      }
      const slots = doctor.slots[selectedDay] ?? [];
      if (slots.length) {
        const row = el('div', 'slots');
        for (const slot of slots) {
          const button = el('button', 'slot', slot[`time_${language}`]);
          button.type = 'button';
          button.addEventListener('click', () =>
            prefill(t.askSlot(doctor.name, day[`label_${language}`], slot[`time_${language}`])),
          );
          row.append(button);
        }
        card.append(row);
      } else {
        card.append(el('p', 'none', t.noSlots));
      }
      list.append(card);
    }
  }

  function renderPatients(t) {
    const list = $('patients');
    list.replaceChildren();
    for (const patient of directory.patients) {
      const item = el('li');
      const button = el('button', 'card patient');
      button.type = 'button';
      button.append(el('span', 'patient-name', patient.name));
      const dob = patient.dob ? formatDob(patient.dob, t) : null;
      button.append(el('span', 'meta', [dob && `${t.born} ${dob}`, patient.phone].filter(Boolean).join(' · ')));
      const tags = el('span', 'tags');
      if (directory.patients.filter((p) => p.phone === patient.phone).length > 1) tags.append(el('span', 'tag', t.sharedPhone));
      if (directory.patients.filter((p) => p.name === patient.name).length > 1) tags.append(el('span', 'tag', t.sameName));
      if (tags.childElementCount) button.append(tags);
      button.addEventListener('click', () => prefill(t.introduce(patient.name, dob ?? '')));
      item.append(button);
      list.append(item);
    }
  }

  function renderDirectory() {
    const t = TEXT[language];
    $('eyebrow').textContent = t.eyebrow;
    $('clinic-name').textContent = directory?.clinic.name ?? t.title;
    $('intro').textContent = t.intro;
    $('doctors-title').textContent = t.doctorsTitle;
    $('doctors-hint').textContent = t.doctorsHint;
    $('patients-title').textContent = t.patientsTitle;
    $('patients-hint').textContent = t.patientsHint;
    $('new-patient').textContent = t.newPatient;

    const status = $('directory-status');
    const message = { loading: t.loading, failed: t.loadFailed }[directoryState]
      ?? (directory && directory.providers.length === 0 ? t.empty : null);
    status.hidden = !message;
    status.textContent = message ?? '';
    if (!directory) return;

    if (!directory.days.some((d) => d.date === selectedDay)) {
      // The first day anyone has a free slot, so the schedule never opens empty.
      const open = directory.days.find((d) => directory.providers.some((p) => p.slots[d.date]?.length));
      selectedDay = (open ?? directory.days[0]).date;
    }
    renderDays(t);
    renderDoctors(t);
    renderPatients(t);
  }

  async function loadDirectory() {
    try {
      const response = await fetch('/api/clinic', { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(String(response.status));
      directory = await response.json();
      directoryState = 'ready';
      renderCall();
    } catch {
      // Keep showing the last schedule if there is one; it is refreshed after each reply.
      if (!directory) directoryState = 'failed';
    }
    renderDirectory();
  }

  $('new-patient').addEventListener('click', () => prefill(TEXT[language].register));

  // ---- Chat -----------------------------------------------------------------

  function add(className, text) {
    const element = document.createElement('div');
    element.className = className;
    element.textContent = text;
    messages.append(element);
    messages.scrollTop = messages.scrollHeight;
    return element;
  }

  function showProgress(text) {
    if (!progress) progress = add('progress', text);
    progress.textContent = text;
    messages.scrollTop = messages.scrollHeight;
  }

  function clearProgress() {
    progress?.remove();
    progress = null;
  }

  function renderStarters() {
    messages.querySelector('.starters')?.remove();
    if (conversationId) return;
    const row = document.createElement('div');
    row.className = 'starters';
    for (const text of TEXT[language].starters) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = text;
      button.addEventListener('click', () => submit(text));
      row.append(button);
    }
    messages.append(row);
  }

  function renderChrome() {
    const t = TEXT[language];
    document.documentElement.lang = language;
    document.title = t.title;
    $('title').textContent = t.title;
    $('subtitle').textContent = t.subtitle;
    $('restart').textContent = t.restart;
    send.textContent = t.send;
    input.placeholder = t.placeholder;
    input.setAttribute('aria-label', t.placeholder);
    notice.textContent = t.handedOff;
    notice.hidden = !handedOff;
    toggles.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === language)));
    renderCall();
  }

  function restart() {
    if (callState !== 'idle') return;
    conversationId = null;
    handedOff = false;
    messages.replaceChildren();
    progress = null;
    renderChrome();
    add('bubble agent', TEXT[language].greeting);
    renderStarters();
    input.focus({ preventScroll: true });
  }

  function handleEvent(event, data) {
    if (event === 'conversation') conversationId = data.id;
    if (event === 'progress') showProgress(TEXT[language].tools[data.tool] ?? TEXT[language].tools.default);
    if (event === 'reply') {
      clearProgress();
      add('bubble agent', data.text);
      handedOff = data.handedOff;
      renderChrome();
    }
    if (event === 'error') {
      clearProgress();
      add('error', TEXT[language].failed);
    }
  }

  async function submit(text) {
    const message = text.trim();
    if (!message || busy || callState !== 'idle') return;
    busy = true;
    send.disabled = true;
    messages.querySelector('.starters')?.remove();
    add('bubble user', message);
    input.value = '';
    input.style.height = '';
    showProgress(TEXT[language].tools.default);
    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, language, ...(conversationId ? { conversationId } : {}) }),
      });
      if (!response.ok) {
        clearProgress();
        add('error', response.status === 429 ? TEXT[language].tooMany : TEXT[language].failed);
        return;
      }
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const event = /^event: (.+)$/m.exec(block)?.[1];
          const data = /^data: (.+)$/m.exec(block)?.[1];
          if (event && data) handleEvent(event, JSON.parse(data));
        }
      }
    } catch {
      add('error', TEXT[language].unreachable);
    } finally {
      clearProgress();
      busy = false;
      send.disabled = false;
      input.focus({ preventScroll: true });
      // A booking or cancellation changes the free times shown beside the chat.
      loadDirectory();
    }
  }

  // ---- Voice ----------------------------------------------------------------
  // A browser call to the same receptionist, through Vapi. The server sees it as a
  // call like any other; this page only shows what was said.

  const VAPI_SDK = 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@3.1.0/+esm';
  let callState = 'idle'; // idle | connecting | live
  let vapi = null;
  // Speech arrives a sentence at a time; consecutive sentences share a bubble.
  let lastSpoken = null;
  let refreshTimer = null;

  function renderCall() {
    const t = TEXT[language];
    const button = $('call');
    const status = $('call-status');
    const onCall = callState !== 'idle';
    button.hidden = !directory?.voice && !onCall;
    button.disabled = callState === 'connecting';
    button.textContent = { idle: t.call, connecting: t.connecting, live: t.endCall }[callState];
    button.setAttribute('aria-pressed', String(callState === 'live'));
    status.hidden = !onCall;
    status.textContent = callState === 'live' ? t.onCall : t.allowMic;
    input.hidden = onCall;
    send.hidden = onCall;
    $('restart').disabled = onCall;
  }

  function setCall(state) {
    callState = state;
    renderCall();
  }

  function callEnded() {
    if (callState === 'idle') return;
    setCall('idle');
    lastSpoken = null;
    add('progress', TEXT[language].callEnded);
    loadDirectory();
  }

  function callFailed(error) {
    setCall('idle');
    const blocked = /^microphone-preflight-(NotAllowed|Security)/.test(error?.type ?? '');
    add('error', blocked ? TEXT[language].micBlocked : TEXT[language].callFailed);
  }

  function onVoiceMessage(message) {
    if (!message?.type?.startsWith('transcript') || message.transcriptType !== 'final') return;
    const text = message.transcript?.trim();
    if (!text) return;
    const role = message.role === 'user' ? 'user' : 'agent';
    if (lastSpoken?.role === role) {
      lastSpoken.element.textContent += ` ${text}`;
      messages.scrollTop = messages.scrollHeight;
    } else {
      lastSpoken = { role, element: add(`bubble ${role}`, text) };
    }
    if (role === 'agent') {
      // A booking made on the call changes the free times beside it.
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadDirectory, 1500);
    }
  }

  async function startCall() {
    if (callState !== 'idle' || !directory?.voice) return;
    // A call is its own conversation, so the chat starts afresh.
    conversationId = null;
    handedOff = false;
    lastSpoken = null;
    progress = null;
    messages.replaceChildren();
    renderChrome();
    setCall('connecting');
    let lastError = null;
    try {
      if (!vapi) {
        // The package is CommonJS; the CDN's ES module wraps it, so the class is one level down.
        const sdk = await import(VAPI_SDK);
        const Vapi = sdk.default?.default ?? sdk.default;
        vapi = new Vapi(directory.voice.publicKey);
        vapi.on('call-start', () => setCall('live'));
        vapi.on('call-end', callEnded);
        vapi.on('message', onVoiceMessage);
        vapi.on('error', (error) => {
          lastError = error;
          console.error('Call error', error);
        });
      }
      const started = await vapi.start(directory.voice.assistantId);
      if (!started) callFailed(lastError);
    } catch (error) {
      console.error('Call failed to start', error);
      callFailed(lastError);
    }
  }

  $('call').addEventListener('click', async () => {
    if (callState === 'idle') return startCall();
    try {
      await vapi?.stop();
    } finally {
      callEnded();
    }
  });

  $('form').addEventListener('submit', (event) => {
    event.preventDefault();
    submit(input.value);
  });

  input.addEventListener('keydown', (event) => {
    // Bangla keyboards compose with Enter, which must not send a half-typed word.
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      submit(input.value);
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = `${input.scrollHeight + 2}px`;
  });

  toggles.forEach((button) => {
    button.addEventListener('click', () => {
      language = button.dataset.lang;
      renderChrome();
      renderDirectory();
      // A call has no chat conversation, but its transcript is still on screen.
      if (!conversationId && callState === 'idle' && !messages.querySelector('.bubble.user')) {
        messages.replaceChildren();
        add('bubble agent', TEXT[language].greeting);
        renderStarters();
      }
    });
  });

  $('restart').addEventListener('click', restart);

  restart();
  renderDirectory();
  loadDirectory();
</script>
</body>
</html>
